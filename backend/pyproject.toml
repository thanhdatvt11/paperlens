[tool.black]
line-length = 79

[project]
name = "paperlens-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi",
    "sqlalchemy",
    "alembic",
    "PyMuPDF",
    "python-multipart",
    "httpx",
]

[project.optional-dependencies]
test = [
    "pytest",
    "httpx",
]

[tool.pylint.format]
max-line-length = 79

[tool.pylint.main]
fail-under = 9.0
